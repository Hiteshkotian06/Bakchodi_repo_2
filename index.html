<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One Little Question 💖</title>

<style>
    body {
        margin: 0;
        font-family: 'Comic Sans MS', cursive;
        overflow: hidden;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        text-align: center;
    }

    .heart {
        position: fixed;
        bottom: -20px;
        color: red;
        font-size: 20px;
        animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0);
            opacity: 1;
        }

        100% {
            transform: translateY(-100vh);
            opacity: 0;
        }
    }

    h1 {
        margin-top: 120px;
        color: white;
        font-size: 32px;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        position: absolute;
        transition: all 0.3s ease;
        z-index: 10;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
        left: 40%;
        top: 55%;
    }

    #noBtn {
        background-color: #28a745;
        color: white;
        left: 55%;
        top: 55%;
    }

    .boom {
        font-size: 60px;
        animation: explode 0.7s ease-out;
    }

    @keyframes explode {
        0% {
            transform: scale(1);
        }

        100% {
            transform: scale(4);
            opacity: 0;
        }
    }

    #main-content {
        width: 100%;
        height: 100vh;
    }
</style>

</head>

<body>

<div id="main-content">

    <h1 id="question"></h1>

    <button id="yesBtn">Yes ❤️</button>

    <button id="noBtn">No 😔</button>

</div>

<audio id="bgMusic" src="./piano_start.mp3"></audio>

<audio id="boomMusic" src="./i_can_love_you.mp3"></audio>


<script>

const bgMusic = document.getElementById("bgMusic");

const boomMusic = document.getElementById("boomMusic");

const yesBtn = document.getElementById("yesBtn");

const noBtn = document.getElementById("noBtn");

const question = document.getElementById("question");

const mainContent = document.getElementById("main-content");

let noClickCount = 0;


// =====================================================
// 1. TYPING EFFECT
// =====================================================

const text = "Rithika, I don't know how to ask for forgiveness, so you choose! 🥺";

let i = 0;

function typeWriter() {

    if (i < text.length) {

        question.innerHTML += text.charAt(i);

        i++;

        setTimeout(typeWriter, 50);

    }

}

typeWriter();


// =====================================================
// 2. MUSIC START ON FIRST INTERACTION
// =====================================================

document.body.addEventListener("click", () => {

    if (bgMusic.paused) {

        bgMusic.currentTime = 20;

        bgMusic.loop = true;

        bgMusic.volume = 0.5;

        bgMusic.play();

    }

}, { once: true });


// =====================================================
// 3. YES RESPONSE
// =====================================================

function showLoveResponse() {

    fadeOut(bgMusic);

    boomMusic.currentTime = 0;

    boomMusic.volume = 1;

    boomMusic.play();


    mainContent.innerHTML = `

        <div style="
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        ">

            <h1 class="boom">
                😍❤️ Yesss!!! ❤️😍
            </h1>

            <h1 style="color:white;">
                Love you too baby 😘
            </h1>

        </div>

    `;

}


// =====================================================
// 4. YES BUTTON
// =====================================================

yesBtn.addEventListener("click", showLoveResponse);


// =====================================================
// 5. NO BUTTON RUNS AWAY
// =====================================================

noBtn.addEventListener("click", () => {

    noClickCount++;

    noBtn.style.position = "fixed";


    if (noClickCount < 6) {

        const x =
            Math.random() * (window.innerWidth - 120);

        const y =
            Math.random() * (window.innerHeight - 60);


        noBtn.style.left = x + "px";

        noBtn.style.top = y + "px";


        // Change the message slightly
        if (noClickCount === 2) {

            question.innerHTML =
                "No? 🥺 Think again...";

        }

        else if (noClickCount === 3) {

            question.innerHTML =
                "Rithika pleaseee 😭";

        }

        else if (noClickCount === 4) {

            question.innerHTML =
                "Why are you running away from me? 🥹";

        }

        else if (noClickCount === 5) {

            question.innerHTML =
                "Okay okay... one last chance? 🥺❤️";

        }

    }

    else {

        // After 5 escapes → apology

        question.innerHTML = "";

        noBtn.style.display = "none";

        yesBtn.style.display = "none";


        setTimeout(() => {

            question.innerHTML = `
                Sorry na baba 🥺<br>
                Please forgive me ❤️<br>
                You mean something to me 🥹
            `;

        }, 300);

    }

});


// =====================================================
// 6. FADE OUT MUSIC
// =====================================================

function fadeOut(audio) {

    let vol = audio.volume;

    const fade = setInterval(() => {

        if (vol > 0.05) {

            vol -= 0.05;

            audio.volume = vol;

        }

        else {

            audio.pause();

            clearInterval(fade);

        }

    }, 100);

}


// =====================================================
// 7. FLOATING HEARTS
// =====================================================

function createHeart() {

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "💖";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 20) + "px";


    document.body.appendChild(heart);


    setTimeout(() => {

        heart.remove();

    }, 5000);

}

setInterval(createHeart, 300);

</script>

</body>
</html>
